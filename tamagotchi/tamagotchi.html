<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Baymax Tamagotchi</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --b1: #2a1650;
        --b2: #0b0716;
        --fg: #e9defa;
        color-scheme: dark;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }

      @media (prefers-color-scheme: light) {
        :root:not([data-theme="dark"]) {
          --b1: #f6ecff;
          --b2: #d8c6f4;
          --fg: #3a2766;
          color-scheme: light;
        }
      }

      :root[data-theme="dark"] {
        --b1: #2a1650;
        --b2: #0b0716;
        --fg: #e9defa;
      }

      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
        height: 100%;
      }

      body {
        margin: 0;
        min-height: 100%;
        background: radial-gradient(
          ellipse at 50% 35%,
          var(--b1),
          var(--b2) 75%
        );
        background-color: var(--b2);
        color: var(--fg);
        font-family: "Pixelify Sans", ui-monospace, monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        overflow: hidden;
      }

      .dev {
        position: relative;
        container-type: inline-size;
        width: min(96vw, calc(100vh - 80px), 820px);
        width: min(96vw, calc(100dvh - 80px), 820px);
        aspect-ratio: 1;
        filter: drop-shadow(0 18px 30px rgba(0, 0, 0, 0.35));
      }

      .shell {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
        pointer-events: none;
      }

      .scr {
        position: absolute;
        left: 35.94%;
        top: 39.84%;
        width: 25.06%;
        height: 25.06%;
        container-type: size;
        overflow: hidden;
        background: #3a2766 url("assets/bg.svg") center/cover;
        image-rendering: pixelated;
      }

      .in {
        position: absolute;
        inset: 0;
        font-size: 6cqw;
        line-height: 1.15;
        color: #fff;
        user-select: none;
      }

      .fade {
        animation: fd 0.2s ease-out;
      }

      @keyframes fd {
        from {
          opacity: 0;
        }
      }

      .sp {
        position: absolute;
        image-rendering: pixelated;
        animation: bob 1.2s ease-in-out infinite;
      }

      @keyframes bob {
        50% {
          transform: translateY(-2.2cqw);
        }
      }

      .pn {
        background: rgba(48, 24, 96, 0.62);
        border-radius: 3cqw;
        padding: 2cqw 3.5cqw;
      }

      .it {
        background: rgba(60, 40, 105, 0.72);
        border-radius: 2cqw;
        padding: 1.5cqw 3cqw;
        white-space: nowrap;
        overflow: hidden;
      }

      .it.on {
        background: rgba(255, 255, 255, 0.45);
        color: #2a1650;
      }

      .it.on .ht path {
        fill: #2a1650;
      }

      .pill {
        position: absolute;
        left: 50%;
        bottom: 3cqw;
        transform: translateX(-50%);
        padding: 1.4cqw 4cqw;
        white-space: nowrap;
      }

      .col {
        position: absolute;
        right: 2cqw;
        display: flex;
        flex-direction: column;
        gap: 2cqw;
      }

      .ab {
        position: absolute;
      }

      .bar {
        width: 19cqw;
        height: 3.4cqw;
        border: 0.7cqw solid #fff;
        border-radius: 3cqw;
        padding: 0.3cqw;
        box-sizing: content-box;
        flex: none;
      }

      .bar i {
        display: block;
        height: 100%;
        background: #ff8fd0;
        border-radius: 2cqw;
        transition: width 0.4s steps(8);
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 2cqw;
      }

      .ht {
        width: 3.6cqw;
        height: 3.1cqw;
        margin-left: 0.5cqw;
        vertical-align: -0.2cqw;
      }

      .ht path {
        fill: #fff;
      }

      .dim {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
      }

      .ctr {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-size: 7.5cqw;
        line-height: 1.3;
      }

      .gr {
        position: absolute;
        left: 2.5cqw;
        right: 2.5cqw;
        top: 25cqw;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.6cqw;
        font-size: 4.6cqw;
      }

      .pad {
        position: absolute;
        left: 32%;
        bottom: 12cqw;
        width: 36%;
        height: 5cqw;
        border-radius: 50%;
        background: #e8e3f5;
        box-shadow: 0 0 5cqw #ff8fd0;
        animation: glow 1s ease-in-out infinite alternate;
      }

      @keyframes glow {
        to {
          box-shadow: 0 0 1cqw #ff8fd0;
        }
      }

      .f1,
      .f2 {
        position: absolute;
        image-rendering: pixelated;
      }

      .f1 {
        animation: fa 0.5s steps(1, end) infinite;
      }

      .f2 {
        animation: fa 0.5s steps(1, end) infinite reverse;
      }

      @keyframes fa {
        0% {
          opacity: 1;
        }

        50% {
          opacity: 0;
        }
      }

      .btn {
        position: absolute;
        width: 10.5%;
        aspect-ratio: 1;
        transform: translate(-50%, -50%);
        border: 0;
        border-radius: 50%;
        background: transparent;
        cursor: pointer;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      .btn:active,
      .btn.dn {
        background: rgba(60, 0, 0, 0.22);
        transform: translate(-50%, -44%);
      }

      .btn:focus-visible {
        outline: 2px dashed var(--fg);
        outline-offset: 2px;
      }

      .foot {
        display: flex;
        gap: 14px;
        align-items: center;
        font-size: 14px;
        opacity: 0.85;
        flex-wrap: wrap;
        justify-content: center;
        padding: 0 12px;
      }

      .foot button {
        font: inherit;
        color: inherit;
        background: none;
        border: 1px solid currentColor;
        border-radius: 8px;
        padding: 3px 10px;
        cursor: pointer;
      }

      .lb {
        position: absolute;
        transform: translateX(-50%);
        font-size: 2.3cqw;
        font-weight: 600;
        white-space: nowrap;
        color: #7a2f2f;
        text-shadow:
          0 0 2px #fff7ec,
          0 0 2px #fff7ec;
        pointer-events: none;
      }
    </style>
  </head>

          if (V.sel === 4) return go("menu");
          startTrain(NAMES[V.sel][0]);
          return;
        }
        if (s === "boss") return turn(V.sel);
        if (s === "end") {
          if (V.sel === 1) return launchGame();
          S = fresh();
          save();
          go("idle");
        }
      }
      function flash(t) {
        V.msg = t;
        render(false);
        after(1500, () => {
          if (V.scr === "train") {
            V.msg = "";
            render(false);
          }
        });
      }
      function doCharge() {
        V.lock = true;
        V.tok++;
        V.scr = "rested";
        V.msg = "Charging...";
        render(true);
        after(1900, () => {
          if (S.tr === 0) S.mood = Math.max(0, S.mood - 8);
          S.energy = C.EMAX;
          S.mood = Math.min(100, S.mood + 10);
          S.day++;
          S.tr = 0;
          save();
          V.msg = "Rested!";
          render(false);
          after(1100, () => {
            V.lock = false;
            go("idle");
          });
        });
      }
      function startTrain(k) {
        if (S.lv[k] >= C.MAXLV) return flash("Already maxed!");
        if (tired()) return flash("Too tired!");
        S.energy -= C.COST;
        S.mood = Math.max(0, S.mood - 4);
        S.tr++;
        V.lock = true;
        V.tok++;
        V.scr = "training";
        V.phase = "run";
        V.trainKey = k;
        V.msg = "Training...";
        render(true);
        after(2300, () => {
          const ok = Math.random() < 0.45 + (S.mood / 100) * 0.45,
            n = NAMES.find((x) => x[0] === k)[1];
          let succeeded = false;
          if (ok) {
            succeeded = true;
            S.xp[k]++;
            S.mood = Math.min(100, S.mood + 6);
            if (S.xp[k] >= C.NEED) {
              S.lv[k]++;
              S.xp[k] = 0;
              V.msg = n + " +1!";
              beep(900, 0.2);
            } else V.msg = n + " improving!";
          } else {
            S.mood = Math.max(0, S.mood - 6);
            V.msg = "Missed it...";
          }
          save();
          if (succeeded) {
            V.phase = "celebrate";
            render(false);
            after(1200, () => {
              V.phase = "done";
              render(false);
              after(800, () => {
                V.lock = false;
                go("train");
              });
            });
          } else {
            V.phase = "done";
            render(false);
            after(1700, () => {
              V.lock = false;
              go("train");
            });
          }
        });
      }
      function startBoss() {
        V.B = {
          php: 6 + 3 * S.lv.health,
          bhp: C.BOSSHP,
          log: "Yokai appears!",
        };
        go("boss");
      }
      function turn(ch) {
        V.lock = true;
        const B = V.B,
          l = S.lv;
        let a = "",
          b = "",
          r;
        if (ch === 0) {
          if (Math.random() < 0.7 + 0.08 * l.agility) {
            const d = 2 + l.strength + (Math.random() < 0.2 ? 1 : 0);
            B.bhp = Math.max(0, B.bhp - d);
            a = `Hit! -${d}.`;
          } else a = "Missed!";
        } else a = ch === 1 ? "Dodge stance." : "Guard up.";
        if (B.bhp <= 0) {
          B.log = a + " Yokai falls!";
          render(false);
          return setTimeout(() => fin("win"), 1300);
        }
        r = 3 + Math.floor(Math.random() * 3);
        if (ch === 1 && Math.random() < 0.3 + 0.15 * l.agility) {
          r = 0;
          b = "Dodged!";
        } else {
          r =
            ch === 2
              ? Math.max(0, r - 1 - l.defense)
              : Math.max(1, r - (l.defense >> 1));
          b = r ? `Yokai hits -${r}.` : "Blocked!";
        }
        B.php = Math.max(0, B.php - r);
        B.log = a + " " + b;
        beep(r ? 200 : 600, 0.12);
        render(false);
        if (B.php <= 0) return setTimeout(() => fin("lose"), 1300);
        setTimeout(() => {
          V.lock = false;
          render(false);
        }, 750);
      }
      function fin(r) {
        S.done = true;
        S.res = r;
        save();
        V.lock = false;
        go("end");
      }
      const bs = { L: $("bL"), M: $("bM"), R: $("bR") };
      for (const k in bs) bs[k].addEventListener("click", () => press(k));
      const km = {
        ArrowLeft: "L",
        a: "L",
        A: "L",
        Enter: "M",
        " ": "M",
        s: "M",
        S: "M",
        ArrowDown: "M",
        ArrowRight: "R",
        d: "R",
        D: "R",
        Escape: "R",
        Backspace: "R",
      };
      addEventListener("keydown", (e) => {
        const k = km[e.key];
        if (!k || e.repeat) return;
        e.preventDefault();
        bs[k].classList.add("dn");
        press(k);
      });
      addEventListener("keyup", (e) => {
        const k = km[e.key];
        if (k) bs[k].classList.remove("dn");
      });
      $("snd").onclick = (e) => {
        mute = !mute;
        e.target.textContent = "Sound: " + (mute ? "off" : "on");
      };
      let rt;
      $("rst").onclick = (e) => {
        if (!rt) {
          e.target.textContent = "Sure?";
          rt = setTimeout(() => {
            rt = 0;
            e.target.textContent = "Reset";
          }, 2500);
        } else {
          clearTimeout(rt);
          rt = 0;
          e.target.textContent = "Reset";
          S = fresh();
          save();
          V.lock = false;
          go("idle");
        }
      };
      render(true);
    </script>
  </body>
</html>
